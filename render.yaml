services:
  - type: web
    name: note-gen
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port=$PORT --server.address=0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
      # Add your OpenAI key in the Render dashboard after first deploy,
      # or uncomment this line and set a placeholder:
      # - key: OPENAI_API_KEY
      #   sync: false
